# ==============================================================================
# Google Cloud Build Configuration for Aumveda Web Service
# Builds container image and deploys to Google Cloud Run
# ==============================================================================
steps:
  # 1. Build Docker image with caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aumveda-web:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aumveda-web:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--cpu-boost'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,GTM_SERVER_URL=${_GTM_SERVER_URL}'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,N8N_WEBHOOK_SECRET=N8N_WEBHOOK_SECRET:latest,META_CAPI_ACCESS_TOKEN=META_CAPI_ACCESS_TOKEN:latest,GA4_API_SECRET=GA4_API_SECRET:latest'

substitutions:
  _SERVICE_NAME: 'aumveda-web'
  _REGION: 'asia-south1'
  _CLOUD_SQL_INSTANCE: '$PROJECT_ID:asia-south1:aumveda-db'
  _GTM_SERVER_URL: 'https://gtm.aumveda.com/collect'

images:
  - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aumveda-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
